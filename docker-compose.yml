services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rs01
      MYSQL_USER: rs01
      MYSQL_PASSWORD: ${DB_PASSWORD:-rs01-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-dev-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rs01
      DB_USERNAME: rs01
      DB_PASSWORD: ${DB_PASSWORD:-rs01-dev-password}
      JWT_SECRET: ${JWT_SECRET:-compose-dev-only-change-this-jwt-secret-2026}
      JWT_EXPIRATION_MILLIS: ${JWT_EXPIRATION_MILLIS:-86400000}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
