spring:
  application:
    name: RS-01
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rs01}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-2026}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
